version: '3.8'

services:
  app:
    build: .
    ports:
      - "8888:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor        # keep container vendor dir intact
      - /var/www/html/node_modules
      - /var/www/html/public/build  # keep vite-built assets from image
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8888"
      ASSET_URL: "http://localhost:8888"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cremoria
      DB_USERNAME: cremoria
      DB_PASSWORD: cremoria

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cremoria
      MYSQL_USER: cremoria
      MYSQL_PASSWORD: cremoria
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
